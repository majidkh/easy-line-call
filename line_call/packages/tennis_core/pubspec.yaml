name: tennis_core
description: muse2 tennis core (court calibration, ball tracking, bounce calls) over FFI.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ">=3.7.0"

dependencies:
  ffi: ^2.1.0
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        ffiPlugin: true
        sharedDarwinSource: true
      macos:
        ffiPlugin: true
        sharedDarwinSource: true
